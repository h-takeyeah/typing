name: Build / Push Docker Image to Registry

on:
  #push: # push is ommited because it always fails without tag
  workflow_dispatch:
    inputs:
      debugtag:
        type: string
        required: true
        description: 'tag for debugging'

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create matrix
        id: targets
        working-directory: docker
        run: |
          echo "matrix=$(docker buildx bake --file docker-bake.hcl --print | jq -cr '.target | keys')" >> ${GITHUB_OUTPUT}
      - name: Show matrix
        run: |
          echo ${{ steps.targets.outputs.matrix }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # tags input must be changed after finishing test
          tags: |
            type=sha
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
      - name: Rename meta bake definition file
        run: |
          mv "${{ steps.meta.outputs.bake-file }}" "${{ runner.temp }}"/bake-meta.json
          mv "${{ steps.meta.outputs.bake-file-annotations }}" "${{ runner.temp }}"/bake-meta-annotations.json
      - name: Upload meta bake definition
        uses: actions/upload-artifact@v4
        with:
          name: bake-mata
          path: |
            ${{ runner.temp }}/bake-meta.json
            ${{ runner.temp }}/bake-meta-annotations.json
          if-no-files-found: error
          retention-days: 1

  image:
    name: Build / Push
    runs-on: ubuntu-latest
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download meta bake definition
        uses: actions/download-artifact@v4
        with:
          name: bake-mata
          path: ${{ runner.temp }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.22.0
          driver: docker-container
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: h-takeyeah
          password: ${{ secrets.GITHUB_TOKEN }}
      # FIXME: できることなら NEXT_PUBLIC_ は使いたくない
      - name: Prepare environment variable file
        if: matrix.target == app
        working-directory: typing-app
        run: echo 'NEXT_PUBLIC_API_URL=${{ secrets.PROD_NEXT_PUBLIC_API_URL }}' >> .env.production
      - name: Docker Buildx Bake
        uses: docker/bake-action@v6
        with:
          source: .
          workdir: docker
          files: |
            docker-bake.hcl
            cwd://${{ runner.temp }}/bake-meta-annotations.json
            cwd://${{ runner.temp }}/bake-meta.json
          push: true
          targets: ${{ matrix.target }}
          set: |
            ${{ matrix.target }}.cache-from=type=gha,scope=buildcache=${{ matrix.target }}
            ${{ matrix.target }}.cache-to=type=gha,scope=buildcache=${{ matrix.target }}
